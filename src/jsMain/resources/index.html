<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoofyAhhSounds</title>
    <style>
        body {
            width: 260px;
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
        }
        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }
        #status {
            margin: 10px 0;
            font-size: 13px;
            word-break: break-all;
        }
        #playButton, #chooseButton {
            width: 100%;
            padding: 8px;
            font-size: 14px;
        }
        #settings {
            margin-top: 14px;
            font-size: 13px;
        }
        #settings h2 {
            font-size: 14px;
            margin: 0 0 6px 0;
        }
        #keyBox {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 6px;
        }
    </style>
</head>
<body>
<h1>GoofyAhhSounds</h1>
<input type="file" id="fileInput" accept="audio/*">
<button id="chooseButton" hidden>Choose sound</button>
<div id="status">No sound selected</div>
<button id="playButton" disabled>Play</button>

<div id="settings">
    <h2>Trigger</h2>
    <div>
        <input type="radio" id="modeSingle" name="mode" value="single" checked>
        <label for="modeSingle">Single key</label>
    </div>
    <div>
        <input type="radio" id="modeAll" name="mode" value="all">
        <label for="modeAll">All keys</label>
    </div>
    <input type="text" id="keyBox" readonly placeholder="Click here, then press a key">
</div>

<script type="module" src="GoofyAhhSounds.js"></script>
</body>
</html>
