<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoofyAhhSounds</title>
    <style>
        body {
            width: 260px;
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
        }
        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }
        #status {
            margin: 10px 0;
            font-size: 13px;
            word-break: break-all;
        }
        #playButton {
            width: 100%;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>GoofyAhhSounds</h1>
    <input type="file" id="fileInput" accept="audio/*">
    <div id="status">No sound selected</div>
    <button id="playButton" disabled>Play</button>
    <script type="module" src="kmp-js-wizard.js"></script>
</body>
</html>
